services:
  vectormbe:
    # Local image = upstream radsilent/vectormbe:latest + poppler-utils (pdftotext)
    # for PDF spec import. `docker compose up -d` builds it from Dockerfile.poppler
    # if the tag is missing (e.g. after a prune), so the boot-time systemd unit
    # keeps working. Run `docker compose build --pull vectormbe` to refresh base.
    image: vectormbe-poppler:latest
    build:
      context: .
      dockerfile: Dockerfile.poppler
    container_name: vectormbe
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - VECTORMBE_LICENSE_KEY=${VECTORMBE_LICENSE_KEY:?Required}
      - VECTORMBE_PORT=8080
      - VECTORMBE_HOST=0.0.0.0
      - VECTORMBE_REQUIRE_TORCH_GPU=false
      - VECTORMBE_STARTUP_GRAPH=demo
      # Runtime graph state. MUST point inside a bind-mounted directory.
      # The default is ./data/vectormbe.snapshot.json — i.e. /app/data, which is
      # NOT mounted (only the three subdirectories below are). That put the live
      # graph in the container's writable layer, so every `compose up` that
      # recreated the container discarded it and restored the stale snapshot
      # baked into the image at build time. Every model edit since that build
      # was silently rolled back on redeploy.
      # data/snapshots is already mounted, so pointing here needs no new mount
      # and avoids shadowing /app/data/demo, which ships inside the image.
      - VECTORMBE_STORAGE_PATH=/app/data/snapshots/vectormbe.snapshot.json
      # Root for every other durable path. Unset, it defaulted to ./data —
      # the same /app/data — for most paths, but env_for_workspace_arc reads it
      # to decide whether a per-session/per-key workspace gets JsonFileStorage
      # or InMemoryStorage. Unset meant InMemoryStorage: every isolated
      # workspace graph lived in process memory and died with the container.
      # Set to the same directory it already defaulted to, so no path moves.
      - VECTORMBE_DATA_DIR=/app/data
      # Demo model used to seed a brand-new visitor session (POST /session/start)
      # and POST /import/default-sample. Without this the server falls back to a
      # path baked in at COMPILE time via env!("CARGO_MANIFEST_DIR") — on a CI
      # build that is the runner's checkout dir, which does not exist in the
      # container, so seeding failed silently with "default sample file not
      # found". Must point at a path that exists inside the container.
      - VECTORMBE_DEFAULT_SAMPLE_PATH=/app/data/demo/process_line.json
      # Retention for per-visitor workspaces. Each seeded session persists a
      # ~280 KB graph under data/workspaces/ AND held an RlEnvironment in memory
      # for the lifetime of the process — workspace_envs was insert-only. The
      # sweeper evicts idle workspaces from memory (non-destructive: the event
      # log is fsynced per mutation, so a returning visitor is restored from
      # disk) and deletes on-disk workspaces past the retention window. A
      # workspace still resident in memory is never deleted underneath itself.
      # Set the interval to 0 to disable the sweeper entirely.
      - VECTORMBE_WORKSPACE_SWEEP_INTERVAL_SECS=${VECTORMBE_WORKSPACE_SWEEP_INTERVAL_SECS:-900}
      - VECTORMBE_WORKSPACE_IDLE_EVICT_SECS=${VECTORMBE_WORKSPACE_IDLE_EVICT_SECS:-3600}
      - VECTORMBE_WORKSPACE_RETENTION_DAYS=${VECTORMBE_WORKSPACE_RETENTION_DAYS:-7}
      # Embedded Oxigraph persistent graph database. Stores entities/relations as
      # RDF triples and is queryable via SPARQL. Existing JSON snapshots are
      # migrated automatically on first startup.
      - VECTORMBE_OXIGRAPH_PATH=/app/data/snapshots/vectormbe.nq
      # Multi-tenant isolation: set to true on shared/demo servers so each
      # API key gets its own isolated graph workspace.
      - VECTORMBE_ISOLATE_BY_SESSION=${VECTORMBE_ISOLATE_BY_SESSION:-false}
      # Optional: persistent vector store. Leave blank to use the in-process
      # HNSW index. Set to http://qdrant:6333 when running the Qdrant service below.
      - VECTORMBE_QDRANT_URL=${VECTORMBE_QDRANT_URL:-}
      # LLM provider for AI synthesis and semantic embeddings
      - VECTORMBE_LLM_PROVIDER=${VECTORMBE_LLM_PROVIDER:-}
      - VECTORMBE_LLM_API_KEY
      - VECTORMBE_LLM_ENDPOINT=${VECTORMBE_LLM_ENDPOINT:-}
      - VECTORMBE_LLM_MODEL=${VECTORMBE_LLM_MODEL:-}
      - OPENAI_API_KEY
      - ANTHROPIC_API_KEY
      # Hybrid embeddings: run locally via the ollama service below.
      - VECTORMBE_EMBEDDING_PROVIDER=${VECTORMBE_EMBEDDING_PROVIDER:-}
      - VECTORMBE_EMBEDDING_URL=${VECTORMBE_EMBEDDING_URL:-}
      - VECTORMBE_EMBEDDING_KEY
      - VECTORMBE_EMBED_MODEL=${VECTORMBE_EMBED_MODEL:-}
      - OLLAMA_HOST=${OLLAMA_HOST:-}
    volumes:
      # The whole data directory, not three subdirectories of it.
      #
      # Mounting only models/, snapshots/ and projects/ left everything else the
      # server writes durably — workspaces/, agent-sessions/, artifacts/,
      # upload-archive/, import-error-logs/, parser-profiles/, and the loose
      # spec_corpus.json, integrations.json, versions.json, ci_runs.json and
      # competency.json — in the container's writable layer, destroyed by the
      # next `compose up --force-recreate`.
      #
      # Those five JSON files cannot be bind-mounted individually: the version,
      # CI and competency stores save write-then-rename, and rename() over a
      # bind-mounted file fails. Their paths are hardcoded relative to the
      # working directory, so they cannot be relocated either. Mounting the
      # parent is the only option that covers them.
      #
      # The earlier warning against mounting all of /app/data was correct as far
      # as it went: it would shadow demo/, samples/ and query-training/, which
      # ship inside the image. Those three were copied to ./data before this
      # mount was introduced, so nothing is shadowed away. The trade-off is that
      # a future image shipping an updated demo dataset will not be seen through
      # this mount — refresh ./data/demo by hand if that dataset changes.
      - ./data:/app/data
    depends_on:
      - ollama

  # Local embedding model server (hybrid: Anthropic for synthesis, Ollama for
  # embeddings). Reachable from the vectormbe container as http://ollama:11434.
  ollama:
    image: ollama/ollama:latest
    container_name: vectormbe-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    # Not published to the host — only the vectormbe container needs it.
    expose:
      - "11434"
    # GPU acceleration: after installing the NVIDIA driver + Container Toolkit,
    # run ./enable-ollama-gpu.sh — it writes docker-compose.override.yml to attach
    # the RTX A1000 to this service. Remove that override file to revert to CPU.

  # Optional: Qdrant persistent vector store.
  # Uncomment this service and set VECTORMBE_QDRANT_URL=http://qdrant:6333 in
  # your .env to enable production-scale ANN with hybrid RRF retrieval.
  # Without it, VectorMBE uses an in-process HNSW index (fine for most use cases).
  #
  # qdrant:
  #   image: qdrant/qdrant:v1.18.0
  #   container_name: vectormbe-qdrant
  #   restart: unless-stopped
  #   volumes:
  #     - qdrant_data:/qdrant/storage
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  caddy:
    image: caddy:2-alpine
    container_name: vectormbe-caddy
    restart: unless-stopped
    # Only :80 is published. TLS terminates at Cloudflare, and the Caddyfile is a
    # plain `:80` site block — nothing ever bound 443 inside the container, so the
    # old "443:443" mappings just left the host listening on a port that answered
    # every handshake with a broken pipe. That reads as a broken TLS listener when
    # you're triaging an outage. Re-add both lines (and a TLS site block in the
    # Caddyfile) only if the origin ever needs to serve HTTPS directly.
    ports:
      - "80:80"
    environment:
      # Staged for the /ollama chat route's shared secret, which is not enforced yet
      # (see the Caddyfile). Optional on purpose: `:-` keeps a deploy working on a
      # host whose .env predates the token, where `:?` would abort the whole run for
      # a variable nothing currently reads.
      - CHAT_PROXY_TOKEN=${CHAT_PROXY_TOKEN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./www:/var/www/vectormbe:ro
    depends_on:
      - vectormbe

volumes:
  caddy_data:
  caddy_config:
  ollama_data:
  # Uncomment when enabling Qdrant:
  # qdrant_data:
